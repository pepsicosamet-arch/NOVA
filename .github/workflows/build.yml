name: NOVA Windows + Android derlemesi ve sürüm

# Yeni sürüm yayınlamak için iki yol var:
#  1) novaapp/__init__.py içindeki VERSION'ı artır (ör. "1.3.1") ve main dalına gönder (push).
#  2) ya da "v1.3.1" gibi bir etiket gönder.
# Bu iş EXE + kurulum dosyasını derler ve GitHub Releases'e ekler.
# Kullanıcıların NOVA'sı açılışta yeni sürümü görür ve tek tıkla günceller.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "novaapp/__init__.py"
      - "android/**"
      - ".github/workflows/build.yml"
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını belirle
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            (Get-Content novaapp/__init__.py) -replace 'VERSION = ".*"', "VERSION = `"$v`"" | Set-Content -Encoding utf8 novaapp/__init__.py
          } else {
            $v = (Select-String -Path novaapp/__init__.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          }
          (Get-Content installer/nova.iss -Encoding utf8) -replace '#define AppVersion ".*"', "#define AppVersion `"$v`"" | Set-Content -Encoding utf8BOM installer/nova.iss
          $skip = "false"
          if ("${{ github.ref }}" -notlike "refs/tags/v*") {
            gh release view "v$v" --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) { $skip = "true"; Write-Host "v$v zaten yayınlanmış, atlanıyor." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Paketleri yükle
        if: steps.ver.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "import uiautomation; print('UIA ok')"

      - name: NOVA.exe oluştur
        if: steps.ver.outputs.skip != 'true'
        run: >
          pyinstaller --noconfirm --clean --windowed --name NOVA
          --icon assets\nova.ico
          --add-data "web;web" --add-data "assets;assets"
          --hidden-import pystray._win32
          --hidden-import uiautomation
          --collect-submodules tinytuya
          --collect-submodules comtypes.gen
          --collect-all _sounddevice_data
          --collect-all _soundfile_data
          main.py

      - name: Inno Setup kur
        if: steps.ver.outputs.skip != 'true'
        run: choco install innosetup -y --no-progress

      - name: Kurulum dosyası oluştur
        if: steps.ver.outputs.skip != 'true'
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\nova.iss'

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          name: NOVA-Windows-Setup
          path: Output/*.exe

      - name: GitHub sürümü (Release) oluştur
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NOVA ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Output/*.exe
          generate_release_notes: true

  android:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: NOVA APK oluştur (telefon + tablet)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/release/app-release.apk "NOVA-${{ needs.build.outputs.version }}-Android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android
          path: NOVA-*-Android.apk

      - name: APK'yı sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: NOVA-*-Android.apk
